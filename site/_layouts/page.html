{%- comment -%}
  Wraps the theme's default layout (jekyll-theme-minimal) to add the edit link
  from the custom_edit_url that build_docs.py injects into every page.
{%- endcomment -%}
{{ content }}

{% if page.custom_edit_url %}
<p class="edit-link"><a href="{{ page.custom_edit_url }}">Improve this page</a></p>
{% endif %}
